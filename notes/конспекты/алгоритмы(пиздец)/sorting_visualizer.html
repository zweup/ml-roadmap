<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Визуализация сортировок и разбиений</title>
<style>
  :root{
    --bg:#f6f7fb;
    --panel:#ffffff;
    --text:#1d2433;
    --muted:#6b7280;
    --line:#d9dee8;
    --accent:#4f46e5;
    --accent2:#0ea5e9;
    --good:#16a34a;
    --warn:#f59e0b;
    --bad:#ef4444;
    --purple:#9333ea;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:24px 28px 14px;
    max-width:1400px;
    margin:auto;
  }
  h1{margin:0 0 8px;font-size:clamp(26px,3vw,42px)}
  .subtitle{color:var(--muted);font-size:15px}
  .wrap{max-width:1400px;margin:auto;padding:0 28px 32px}
  .toolbar,.panel,.info{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 8px 24px rgba(35,45,70,.06);
  }
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;
    padding:14px;margin-bottom:16px;
  }
  button,select,input{
    font:inherit;
  }
  button{
    border:1px solid var(--line);
    background:#fff;
    color:var(--text);
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    transition:.15s;
  }
  button:hover{transform:translateY(-1px);border-color:#b7c0d0}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.active{background:#eef2ff;border-color:#a5b4fc;color:#3730a3}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}
  input[type="text"]{
    min-width:320px;flex:1;
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    background:#fff;
  }
  input[type="range"]{width:160px}
  .algo-tabs{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
  }
  .panel{padding:18px;min-height:560px}
  .controls{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;
  }
  .controls .grow{flex:1}
  .speed{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
  .stage{
    display:grid;
    grid-template-columns:minmax(0,1.8fr) minmax(280px,.8fr);
    gap:16px;
  }
  .visual{
    min-height:440px;
    border:1px dashed #cfd6e3;
    border-radius:16px;
    padding:18px;
    position:relative;
    overflow:auto;
    background:linear-gradient(180deg,#fff,#fbfcff);
  }
  .side{
    display:flex;flex-direction:column;gap:12px;
  }
  .info{padding:14px}
  .info h3{margin:0 0 8px;font-size:15px}
  .info p{margin:0;color:var(--muted);line-height:1.45}
  .code{
    white-space:pre-wrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;line-height:1.5;
    background:#111827;color:#e5e7eb;
    padding:14px;border-radius:14px;overflow:auto;
    min-height:220px;
  }
  .code .hl{
    display:block;background:#312e81;color:#fff;
    margin:0 -14px;padding:0 14px;
  }
  .array-row{
    display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;
    min-height:120px;margin:18px 0 12px;
  }
  .cell{
    width:58px;min-height:58px;
    border:2px solid #cfd6e3;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:20px;background:#fff;
    position:relative;transition:.25s;
  }
  .cell small{
    position:absolute;top:-22px;font-size:11px;color:var(--muted);font-weight:600;
  }
  .cell.pivot{border-color:var(--warn);background:#fff7ed}
  .cell.left{border-color:var(--accent2);background:#eff6ff}
  .cell.right{border-color:var(--purple);background:#faf5ff}
  .cell.active{border-color:var(--bad);background:#fef2f2}
  .cell.good{border-color:var(--good);background:#f0fdf4}
  .cell.sorted{border-color:var(--good);background:#dcfce7}
  .cell.dim{opacity:.35}
  .label-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .legend{
    display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px
  }
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
  .bars{
    display:flex;align-items:flex-end;gap:8px;min-height:260px;
    border-bottom:1px solid var(--line);padding:12px 4px;
  }
  .bar{
    flex:1;min-width:20px;max-width:58px;
    background:#c7d2fe;border-radius:8px 8px 0 0;
    position:relative;transition:.3s;
  }
  .bar span{
    position:absolute;top:-24px;left:50%;transform:translateX(-50%);
    font-size:12px;font-weight:700
  }
  .bar.active{background:#fecaca}
  .bar.good{background:#bbf7d0}
  .bar.pivot{background:#fde68a}
  .count-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));
    gap:8px;margin-top:18px
  }
  .count-box{
    border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff
  }
  .count-box .k{font-size:12px;color:var(--muted)}
  .count-box .v{font-weight:800;font-size:20px}
  .tree{display:flex;flex-direction:column;gap:18px}
  .tree-level{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .segment{
    border:2px solid #cfd6e3;border-radius:12px;padding:10px 12px;background:#fff;
    min-width:120px;text-align:center;font-weight:700
  }
  .segment.active{border-color:var(--accent);background:#eef2ff}
  .segment.good{border-color:var(--good);background:#f0fdf4}
  .explain{
    background:#f8fafc;border-left:4px solid var(--accent);
    padding:12px 14px;border-radius:10px;line-height:1.45;
  }
  .status{font-weight:700}
  @media (max-width:900px){
    .stage{grid-template-columns:1fr}
    input[type="text"]{min-width:100%}
  }
</style>
</head>
<body>
<header>
  <h1>Визуализация алгоритмов сортировки</h1>
  <div class="subtitle">Counting Sort · Merge Sort · Partition Ломуто · Partition Хоара · Quick Sort</div>
</header>

<div class="wrap">
  <div class="toolbar">
    <input id="arrayInput" type="text" value="7, 2, 9, 4, 3, 8, 5, 1, 6" />
    <button id="applyBtn">Применить массив</button>
    <button id="randomBtn">Случайный массив</button>
  </div>

  <div class="algo-tabs">
    <button data-algo="counting" class="active">Counting Sort</button>
    <button data-algo="merge">Merge Sort</button>
    <button data-algo="lomuto">Partition Ломуто</button>
    <button data-algo="hoare">Partition Хоара</button>
    <button data-algo="quick">Quick Sort</button>
  </div>

  <div class="panel">
    <div class="controls">
      <button id="resetBtn">↺ Сброс</button>
      <button id="prevBtn">← Шаг назад</button>
      <button id="nextBtn" class="primary">Шаг вперёд →</button>
      <button id="playBtn">▶ Авто</button>
      <div class="grow"></div>
      <div class="speed">Скорость
        <input id="speedRange" type="range" min="150" max="1400" step="50" value="650">
      </div>
    </div>

    <div class="stage">
      <div class="visual" id="visual"></div>
      <div class="side">
        <div class="info">
          <h3>Текущий шаг</h3>
          <p id="stepText">—</p>
        </div>
        <div class="info">
          <h3>Инвариант / идея</h3>
          <p id="ideaText">—</p>
        </div>
        <div class="code" id="codeBox"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let baseArray = [7,2,9,4,3,8,5,1,6];
let algo = "counting";
let steps = [];
let idx = 0;
let timer = null;

const codeMap = {
counting: [
"count = [0] * (max_value + 1)",
"for x in arr:",
"    count[x] += 1",
"",
"result = []",
"for value in range(len(count)):",
"    repeat count[value] times:",
"        result.append(value)"
],
merge: [
"merge_sort(arr):",
"    if len(arr) <= 1: return arr",
"    mid = len(arr) // 2",
"    left = merge_sort(arr[:mid])",
"    right = merge_sort(arr[mid:])",
"    return merge(left, right)"
],
lomuto: [
"pivot = arr[right]",
"i = left - 1",
"for j = left .. right - 1:",
"    if arr[j] <= pivot:",
"        i += 1",
"        swap(arr[i], arr[j])",
"swap(arr[i + 1], arr[right])",
"return i + 1"
],
hoare: [
"pivot = arr[(left + right) // 2]",
"l = left",
"r = right",
"while true:",
"    while arr[l] < pivot: l += 1",
"    while arr[r] > pivot: r -= 1",
"    if l >= r: return r",
"    swap(arr[l], arr[r])",
"    l += 1",
"    r -= 1"
],
quick: [
"quick_sort(arr, left, right):",
"    if left >= right: return",
"    p = partition_hoare(arr, left, right)",
"    quick_sort(arr, left, p)",
"    quick_sort(arr, p + 1, right)"
]
};

function setCode(line=-1){
  const code = codeMap[algo];
  $("#codeBox").innerHTML = code.map((x,i)=>`<span class="${i===line?'hl':''}">${escapeHtml(x)}</span>`).join("\n");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function parseArray(){
  const vals = $("#arrayInput").value.split(/[\s,;]+/).filter(Boolean).map(Number);
  if(!vals.length || vals.some(x=>!Number.isFinite(x))){
    alert("Введите числа через запятую или пробел.");
    return null;
  }
  return vals.map(x=>Math.trunc(x));
}

function barsHtml(arr, classes={}){
  const max = Math.max(...arr.map(x=>Math.abs(x)),1);
  return `<div class="bars">${arr.map((v,i)=>{
    const cls = classes[i] || "";
    const h = 40 + 180*Math.abs(v)/max;
    return `<div class="bar ${cls}" style="height:${h}px"><span>${v}</span></div>`;
  }).join("")}</div>`;
}
function cellsHtml(arr, classes={}, labels={}){
  return `<div class="array-row">${arr.map((v,i)=>{
    return `<div class="cell ${classes[i]||''}">${labels[i]?`<small>${labels[i]}</small>`:''}${v}</div>`;
  }).join("")}</div>`;
}

function buildCounting(arr){
  if(arr.some(x=>x<0)){
    return [{
      arr, text:"Counting Sort в этой демонстрации работает только с неотрицательными целыми числами.",
      idea:"Измените массив, чтобы все элементы были ≥ 0.", line:0, error:true
    }];
  }
  const max = Math.max(...arr);
  const count = Array(max+1).fill(0);
  const st = [{arr:[...arr], count:[...count], out:[], text:"Создаём массив счётчиков от 0 до max.", idea:"count[v] хранит количество вхождений значения v.", line:0, phase:"count"}];
  arr.forEach((x,i)=>{
    count[x]++;
    st.push({arr:[...arr], count:[...count], out:[], active:i, activeValue:x,
      text:`Читаем arr[${i}] = ${x}. Увеличиваем count[${x}].`,
      idea:"После прохода count[v] точно равен числу элементов v во входе.", line:2, phase:"count"});
  });
  const out=[];
  for(let v=0;v<count.length;v++){
    for(let k=0;k<count[v];k++){
      out.push(v);
      st.push({arr:[...arr], count:[...count], out:[...out], activeValue:v,
        text:`Добавляем ${v} в результат (${k+1} из ${count[v]}).`,
        idea:"Выводим значения по возрастанию, повторяя каждое count[value] раз.", line:7, phase:"build"});
    }
  }
  st.push({arr:[...arr], count:[...count], out:[...out], text:"Сортировка завершена.", idea:"Время O(n + k), где k — диапазон значений.", line:-1, phase:"done"});
  return st;
}

function buildLomuto(arr){
  const a=[...arr], left=0, right=a.length-1, pivot=a[right];
  let i=left-1;
  const st=[{arr:[...a], pivot:right, i, j:null, text:`Опорный элемент pivot = ${pivot} (последний элемент).`, idea:"Слева от i будут элементы ≤ pivot.", line:0}];
  for(let j=left;j<right;j++){
    st.push({arr:[...a], pivot:right, i, j, text:`Сравниваем arr[${j}] = ${a[j]} с pivot = ${pivot}.`, idea:"j просматривает элементы слева направо.", line:2});
    if(a[j] <= pivot){
      i++;
      [a[i],a[j]]=[a[j],a[i]];
      st.push({arr:[...a], pivot:right, i, j, text:`${a[i]} ≤ pivot: расширяем левую часть и меняем arr[${i}] ↔ arr[${j}].`, idea:"Теперь все элементы left..i ≤ pivot.", line:5});
    }
  }
  [a[i+1],a[right]]=[a[right],a[i+1]];
  st.push({arr:[...a], pivot:i+1, i:i+1, j:null, text:`Ставим pivot на позицию ${i+1}.`, idea:"Pivot оказался на своей окончательной позиции.", line:6});
  return st;
}

function buildHoare(arr, left=0, right=arr.length-1, forQuick=false){
  const a=[...arr], pivotVal=a[Math.floor((left+right)/2)];
  let l=left, r=right;
  const st=[{arr:[...a], l,r,pivotVal,left,right,text:`pivot = ${pivotVal}, l = ${l}, r = ${r}.`,idea:"Ищем слева элемент ≥ pivot и справа элемент ≤ pivot.",line:0}];
  let guard=0;
  while(true && guard++<1000){
    while(a[l] < pivotVal){
      st.push({arr:[...a],l,r,pivotVal,left,right,text:`arr[l] = ${a[l]} < ${pivotVal}, поэтому l → ${l+1}.`,idea:"Слева пропускаем элементы, которые уже на правильной стороне.",line:4});
      l++;
    }
    while(a[r] > pivotVal){
      st.push({arr:[...a],l,r,pivotVal,left,right,text:`arr[r] = ${a[r]} > ${pivotVal}, поэтому r → ${r-1}.`,idea:"Справа пропускаем элементы, которые уже на правильной стороне.",line:5});
      r--;
    }
    st.push({arr:[...a],l,r,pivotVal,left,right,text:`Остановились: l = ${l}, r = ${r}.`,idea:"arr[l] ≥ pivot, arr[r] ≤ pivot.",line:6});
    if(l>=r){
      st.push({arr:[...a],l,r,pivotVal,left,right,split:r,text:`l ≥ r. Возвращаем границу ${r}.`,idea:"left..r ≤ pivot, r+1..right ≥ pivot.",line:6});
      return {steps:st, arr:a, split:r};
    }
    [a[l],a[r]]=[a[r],a[l]];
    st.push({arr:[...a],l,r,pivotVal,left,right,text:`Меняем arr[${l}] и arr[${r}] местами.`,idea:"Нарушители переходят на нужные стороны.",line:7});
    l++; r--;
    st.push({arr:[...a],l,r,pivotVal,left,right,text:`Сдвигаем оба указателя: l = ${l}, r = ${r}.`,idea:"Это важно, особенно при элементах, равных pivot.",line:8});
  }
  return {steps:st, arr:a, split:r};
}

function buildMerge(arr){
  const st=[];
  function rec(a, depth=0, label=""){
    st.push({tree: snapshotTree(a, depth, "split", label), arr:[...arr], text:`Разбиваем [${a.join(", ")}]`, idea:"Merge Sort рекурсивно делит массив пополам.", line:1});
    if(a.length<=1) return a;
    const m=Math.floor(a.length/2);
    const l=rec(a.slice(0,m),depth+1,"L");
    const r=rec(a.slice(m),depth+1,"R");
    const merged=[]; let i=0,j=0;
    while(i<l.length || j<r.length){
      if(j>=r.length || (i<l.length && l[i]<=r[j])) merged.push(l[i++]);
      else merged.push(r[j++]);
      st.push({merge:{left:[...l],right:[...r],out:[...merged]}, text:`Сливаем: [${l}] + [${r}] → [${merged}]`, idea:"На каждом шаге берём меньший из первых ещё не использованных элементов.", line:5});
    }
    return merged;
  }
  const final=rec([...arr]);
  st.push({merge:{left:[],right:[],out:[...final]},text:"Сортировка завершена.",idea:"Merge Sort работает за O(n log n) и требует дополнительную память.",line:-1});
  return st;
}
function snapshotTree(a,depth,phase,label){ return {a:[...a],depth,phase,label}; }

function buildQuick(arr){
  const st=[], a=[...arr];
  function q(left,right,depth=0){
    if(left>=right){
      if(left===right) st.push({arr:[...a],left,right,sorted:[left],text:`Участок [${left}, ${right}] уже отсортирован.`,idea:"База рекурсии: длина ≤ 1.",line:1,depth});
      return;
    }
    st.push({arr:[...a],left,right,text:`Quick Sort для диапазона [${left}, ${right}].`,idea:"Разделяем диапазон на две части с помощью partition Хоара.",line:2,depth});
    const pivotVal=a[Math.floor((left+right)/2)];
    let l=left,r=right;
    while(true){
      while(a[l]<pivotVal){ st.push({arr:[...a],left,right,l,r,pivotVal,text:`l → ${l+1}: ${a[l]} < pivot ${pivotVal}`,idea:"Ищем первый элемент, который должен уйти вправо.",line:2,depth}); l++; }
      while(a[r]>pivotVal){ st.push({arr:[...a],left,right,l,r,pivotVal,text:`r → ${r-1}: ${a[r]} > pivot ${pivotVal}`,idea:"Ищем первый элемент, который должен уйти влево.",line:2,depth}); r--; }
      if(l>=r){
        st.push({arr:[...a],left,right,l,r,pivotVal,split:r,text:`Partition завершён. Граница = ${r}.`,idea:"Теперь рекурсивно сортируем две части.",line:2,depth});
        break;
      }
      [a[l],a[r]]=[a[r],a[l]];
      st.push({arr:[...a],left,right,l,r,pivotVal,text:`swap(${l}, ${r})`,idea:"Меняем два элемента, стоящих на неверных сторонах.",line:2,depth});
      l++;r--;
    }
    const p=r;
    q(left,p,depth+1);
    q(p+1,right,depth+1);
  }
  q(0,a.length-1);
  st.push({arr:[...a],sorted:[...a.keys()],text:"Quick Sort завершён.",idea:"Средняя сложность O(n log n), худшая O(n²).",line:-1,depth:0});
  return st;
}

function build(){
  if(algo==="counting") steps=buildCounting(baseArray);
  if(algo==="merge") steps=buildMerge(baseArray);
  if(algo==="lomuto") steps=buildLomuto(baseArray);
  if(algo==="hoare") steps=buildHoare(baseArray).steps;
  if(algo==="quick") steps=buildQuick(baseArray);
  idx=0; stopAuto(); render();
}

function render(){
  const s=steps[idx] || {};
  $("#stepText").textContent = `${idx+1}/${steps.length}. ${s.text||""}`;
  $("#ideaText").textContent = s.idea||"";
  setCode(s.line ?? -1);
  $("#prevBtn").disabled = idx<=0;
  $("#nextBtn").disabled = idx>=steps.length-1;

  const v=$("#visual");
  if(algo==="counting"){
    if(s.error){ v.innerHTML=`<div class="explain">${s.text}</div>`; return; }
    let cls={}; if(s.active!=null) cls[s.active]="active";
    const count = s.count||[];
    const out=s.out||[];
    v.innerHTML = `
      <div class="status">Исходный массив</div>
      ${cellsHtml(s.arr||baseArray,cls)}
      <div class="status">Массив count</div>
      <div class="count-grid">${count.map((x,i)=>`<div class="count-box ${s.activeValue===i?'active':''}"><div class="k">значение ${i}</div><div class="v">${x}</div></div>`).join("")}</div>
      <div class="status" style="margin-top:22px">Результат</div>
      ${cellsHtml(out,Object.fromEntries(out.map((_,i)=>[i,"good"])))}
    `;
  } else if(algo==="merge"){
    if(s.merge){
      v.innerHTML=`
        <div class="status">Слияние</div>
        <div class="explain">Левая часть: [${s.merge.left.join(", ")}]<br>Правая часть: [${s.merge.right.join(", ")}]</div>
        <div style="margin-top:16px">${cellsHtml(s.merge.out,Object.fromEntries(s.merge.out.map((_,i)=>[i,"good"])))}</div>
      `;
    } else {
      const a=s.tree?.a||baseArray;
      const mid=Math.floor(a.length/2);
      v.innerHTML=`
        <div class="status">Рекурсивное разбиение</div>
        <div class="tree">
          <div class="tree-level"><div class="segment active">[${a.join(", ")}]</div></div>
          ${a.length>1?`<div class="tree-level"><div class="segment">[${a.slice(0,mid).join(", ")}]</div><div class="segment">[${a.slice(mid).join(", ")}]</div></div>`:""}
        </div>
      `;
    }
  } else {
    const arr=s.arr||baseArray;
    const cls={}, labels={};
    if(s.pivot!=null){cls[s.pivot]="pivot";labels[s.pivot]="pivot"}
    if(s.l!=null){cls[s.l]=(cls[s.l]||"")+" left";labels[s.l]=(labels[s.l]?labels[s.l]+", ":"")+"L"}
    if(s.r!=null){cls[s.r]=(cls[s.r]||"")+" right";labels[s.r]=(labels[s.r]?labels[s.r]+", ":"")+"R"}
    if(s.j!=null){cls[s.j]=(cls[s.j]||"")+" active";labels[s.j]=(labels[s.j]?labels[s.j]+", ":"")+"j"}
    if(s.i!=null && s.i>=0){cls[s.i]=(cls[s.i]||"")+" left";labels[s.i]=(labels[s.i]?labels[s.i]+", ":"")+"i"}
    if(s.sorted) s.sorted.forEach(k=>cls[k]="sorted");
    if(s.left!=null && s.right!=null){
      for(let k=0;k<arr.length;k++) if(k<s.left||k>s.right) cls[k]=(cls[k]||"")+" dim";
    }
    v.innerHTML=`
      ${cellsHtml(arr,cls,labels)}
      ${barsHtml(arr,cls)}
      <div class="legend">
        <span><span class="dot" style="background:#fde68a"></span>pivot</span>
        <span><span class="dot" style="background:#bfdbfe"></span>левый указатель</span>
        <span><span class="dot" style="background:#e9d5ff"></span>правый указатель</span>
        <span><span class="dot" style="background:#fecaca"></span>текущий элемент</span>
      </div>
      ${s.split!=null?`<div class="explain" style="margin-top:18px">Граница разбиения: <b>${s.split}</b></div>`:""}
    `;
  }
}

function stopAuto(){
  if(timer){clearInterval(timer);timer=null}
  $("#playBtn").textContent="▶ Авто";
}
function startAuto(){
  stopAuto();
  $("#playBtn").textContent="⏸ Пауза";
  const delay = 1550 - Number($("#speedRange").value);
  timer=setInterval(()=>{
    if(idx>=steps.length-1){stopAuto();return}
    idx++;render();
  },Math.max(120,delay));
}

$$(".algo-tabs button").forEach(b=>b.addEventListener("click",()=>{
  $$(".algo-tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");algo=b.dataset.algo;build();
}));
$("#applyBtn").addEventListener("click",()=>{
  const a=parseArray(); if(a){baseArray=a;build();}
});
$("#randomBtn").addEventListener("click",()=>{
  const n=9;
  baseArray=Array.from({length:n},()=>Math.floor(Math.random()*10));
  $("#arrayInput").value=baseArray.join(", ");
  build();
});
$("#resetBtn").addEventListener("click",()=>{idx=0;stopAuto();render()});
$("#prevBtn").addEventListener("click",()=>{if(idx>0){idx--;render()}});
$("#nextBtn").addEventListener("click",()=>{if(idx<steps.length-1){idx++;render()}});
$("#playBtn").addEventListener("click",()=> timer?stopAuto():startAuto());
$("#speedRange").addEventListener("input",()=>{if(timer)startAuto()});

build();
</script>
</body>
</html>
